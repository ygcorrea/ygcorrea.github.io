<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Em breve</title>
  <meta name="description" content="Em breve.">
  <style>
    :root { --bg: #f6f1ea; --bg-2: #f1e9df; --text: #2b1d15; --muted: #6b584b; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #16110e; --bg-2: #120e0b; --text: #f6eee6; --muted: #b3a194; color-scheme: dark; }
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 16px;
      box-sizing: border-box;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
    }
    h1 { margin: 0; font-size: clamp(36px, 9vw, 64px); letter-spacing: -0.03em; font-weight: 800; }
    p { margin: 10px 0 0; color: var(--muted); font-size: 17px; }
  </style>
</head>
<body>
  <main>
    <h1>Em breve</h1>
    <p>Novidades chegando por aqui.</p>
  </main>
</body>
</html>
